# ===============================
# Privada Río Gandarilla - API
# ===============================
server.port=${SERVER_PORT:4000}
server.servlet.context-path=/
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

spring.application.name=gandarilla-api
spring.lifecycle.timeout-per-shutdown-phase=20s

# PostgreSQL. La contraseña no tiene valor por defecto deliberadamente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Gandarilla}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:0}

# Flyway crea las tablas al iniciar si la base ya existe.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never

# JSON y zona horaria
spring.jackson.time-zone=America/Mazatlan
spring.jackson.locale=es_MX
spring.jackson.default-property-inclusion=always

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# OpenAPI
app.openapi.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS: nunca usar '*'.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Seguridad
app.security.enabled=${SECURITY_ENABLED:true}
app.security.api-bearer-secret=${API_BEARER_SECRET:}
app.security.api-bearer-expiration=${API_BEARER_EXPIRATION:1h}
app.security.public-paths=/api/health,/actuator/health,/actuator/info

# Acceso al frontend cuando SECURITY_ENABLED=true
app.web.username=${WEB_USERNAME:}
app.web.password=${WEB_PASSWORD:}
app.monthly-fee.amount=${MONTHLY_FEE_AMOUNT:800.00}

# Rate limiting por instancia
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.read-requests-per-minute=${RATE_LIMIT_READ_PER_MINUTE:120}
app.rate-limit.write-requests-per-minute=${RATE_LIMIT_WRITE_PER_MINUTE:20}
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED:false}

# Datos del comprobante
app.receipt.concept=${RECEIPT_CONCEPT:Pago de mantenimiento}
app.receipt.validated-by=${RECEIPT_VALIDATED_BY:Tesorer\u00EDa}
app.receipt.organization-name=${RECEIPT_ORGANIZATION_NAME:PRIVADA R\u00CDO GANDARILLA A.C.}
app.receipt.organization-area=${RECEIPT_ORGANIZATION_AREA:Tesorer\u00EDa}
app.receipt.archive-enabled=${RECEIPT_ARCHIVE_ENABLED:true}
app.receipt.archive-path=${RECEIPT_ARCHIVE_PATH:generated-receipts}
app.receipt.monthly-archive-path=${RECEIPT_MONTHLY_ARCHIVE_PATH:recibos}
app.receipt.duplicate-window=${RECEIPT_DUPLICATE_WINDOW:30s}
app.receipt.logo-path=classpath:branding/logo.png
app.receipt.background-path=classpath:branding/fondo.png
app.receipt.font-path=${RECEIPT_FONT_PATH:classpath:fonts/DejaVuSans.ttf}

# WhatsApp Cloud API. En local queda deshabilitado y se simula el envío.
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:recibo_pago_mantenimiento}
app.whatsapp.language-code=${WHATSAPP_LANGUAGE_CODE:es_MX}
app.whatsapp.connect-timeout=${WHATSAPP_CONNECT_TIMEOUT:5s}
app.whatsapp.read-timeout=${WHATSAPP_READ_TIMEOUT:20s}

# Logs
logging.level.root=INFO
logging.level.com.riogandarilla.api=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc.core=WARN
